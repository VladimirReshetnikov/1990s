<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hollowmere</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; cursor: none; }
  #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
          color: #c8a050; font: bold 18px/1.4 "Courier New", monospace; letter-spacing: 2px; text-align: center; }
  #boot small { color: #6a5a40; font-size: 13px; }
</style>
</head>
<body>
<canvas id="screen" width="320" height="200"></canvas>
<div id="boot"><div>LOADING...</div><small>building textures</small></div>

<!-- RetroEngine -->
<script src="engine/core.js" charset="utf-8"></script>
<script src="engine/palette.js" charset="utf-8"></script>
<script src="engine/pix.js" charset="utf-8"></script>
<script src="engine/font.js" charset="utf-8"></script>
<script src="engine/assets.js" charset="utf-8"></script>
<script src="engine/stock/textures.js" charset="utf-8"></script>
<script src="engine/stock/sprites.js" charset="utf-8"></script>
<script src="engine/world.js" charset="utf-8"></script>
<script src="engine/render.js" charset="utf-8"></script>
<script src="engine/entities.js" charset="utf-8"></script>
<script src="engine/audio.js" charset="utf-8"></script>
<script src="engine/game.js" charset="utf-8"></script>
<script src="engine/ui.js" charset="utf-8"></script>
<script src="engine/main.js" charset="utf-8"></script>
<script src="engine/debug.js" charset="utf-8"></script>

<!-- Campaigns ("variations"). Add a line per campaign; the title menu lets you pick. -->
<script src="campaigns/hollowmere/assets.js" charset="utf-8"></script>
<script src="campaigns/hollowmere/campaign.js" charset="utf-8"></script>
<script src="campaigns/lighthouse/campaign.js" charset="utf-8"></script>

<script>
  // Let the "LOADING" text paint before the (synchronous) texture build.
  setTimeout(() => {
    try {
      RetroEngine.boot(document.getElementById('screen'));
      document.getElementById('boot').remove();
    } catch (e) {
      document.getElementById('boot').innerHTML = 'FAILED TO START<br><small>' + String(e.message).replace(/</g, '&lt;') + '</small>';
      throw e;
    }
  }, 50);
</script>
</body>
</html>
